<!DOCTYPE html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$page_title</title>
<meta name="description" content="$description">
<link rel="alternate" hreflang="en" href="$href_en">
<link rel="alternate" hreflang="fr" href="$href_fr">
<link rel="alternate" type="text/plain" href="$href_llms" title="llms.txt">
<style>
/* One type scale, by semantic level: house > book > subtitle > body > label. A component never takes a size of its own. */
:root {
  --t-house: 48px; --t-book: 34px; --t-subtitle: 24px; --t-body: 20px; --t-label: 14px;
  --ink: #17140f; --paper: #fbf8f3; --quiet: #54504a; --rule: #d9d2c7; --accent: #8a3b12;
}
@media (max-width: 480px) {
  :root { --t-house: 38px; --t-book: 28px; --t-subtitle: 21px; --t-body: 19px; --t-label: 14px; }
}
@media (prefers-color-scheme: dark) {
  :root { --ink: #efe9df; --paper: #171512; --quiet: #a89f92; --rule: #38332c; --accent: #e0a074; }
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0 auto; padding: 48px 16px 64px; max-width: 46rem; color: var(--ink); background: var(--paper);
  font: var(--t-body)/1.65 Georgia, 'EB Garamond', 'Times New Roman', serif; }
.logo { display: inline-block; vertical-align: -0.12em; height: 1.15em; width: auto; }
.brand { margin: 0 0 12px; }
.brand a { display: inline-block; line-height: 0; }
.brand .logo { height: 36px; }
h1 .logo { height: 1.1em; }
h1 { font-size: var(--t-house); line-height: 1.1; margin: 4px 0 16px; letter-spacing: .01em; }
h2 { font-size: var(--t-book); line-height: 1.2; margin: 0 0 4px; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.label { font: 600 var(--t-label)/1.4 system-ui, 'Segoe UI', sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--quiet); margin: 0; }
.lead { font-size: var(--t-subtitle); line-height: 1.45; margin: 0 0 20px; }
.site-nav, .lang { margin: 0 0 8px; font: 500 var(--t-label)/1.4 system-ui, 'Segoe UI', sans-serif; }
.site-nav { display: flex; flex-wrap: wrap; gap: 4px 20px; }
.site-nav [aria-current], .lang [aria-current] { color: var(--ink); font-weight: 700; text-decoration: none; }
body.home { max-width: 62rem; }
.books { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 56px 64px; border-top: 1px solid var(--rule); padding: 40px 0; }
.book { min-width: 0; }
.book .cover { display: block; margin: 0 0 24px; }
.book .cover img { display: block; width: 100%; max-width: 440px; height: auto; border: 1px solid var(--rule);
  box-shadow: 0 10px 28px rgba(0, 0, 0, .14), 0 1px 3px rgba(0, 0, 0, .12); }
.book .cover:hover img { box-shadow: 0 14px 34px rgba(0, 0, 0, .2), 0 1px 3px rgba(0, 0, 0, .14); }
.book .cover-block .cover { margin: 0 0 12px; }
.book .cover .flip { display: block; perspective: 1800px; }
.book .cover .inner { display: block; position: relative; max-width: 440px; transform-style: preserve-3d; transition: transform .7s ease; }
.book .cover-block.is-back .inner { transform: rotateY(180deg); }
.book .cover .inner img { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.book .cover .inner img.back { position: absolute; top: 0; left: 0; transform: rotateY(180deg); }
.faces { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin: 0 0 24px;
  font: 500 var(--t-label)/1.4 system-ui, 'Segoe UI', sans-serif; }
.faces[hidden] { display: none; }
.faces .sides { display: inline-flex; border: 1px solid var(--ink); border-radius: 4px; overflow: hidden; }
.faces button { font: inherit; padding: 6px 16px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.faces button + button { border-left: 1px solid var(--ink); }
.faces button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.faces button:focus-visible, .faces a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .book .cover .inner { transition: none; } }
.work, .agents, .prose section { display: block; border-top: 1px solid var(--rule); padding: 32px 0; }
.prose h2 { margin-bottom: 12px; }
.prose p { margin: 0 0 12px; }
.prose ul { margin: 0 0 12px; padding-left: 1.2em; }
.work .text, .agents .text { max-width: 46rem; }
.subtitle { font-size: var(--t-subtitle); line-height: 1.35; margin: 0 0 12px; }
.tagline { font-style: italic; margin: 0 0 12px; }
.state { margin: 0 0 12px; }
.links { list-style: none; margin: 0 0 12px; padding: 0; }
.links li { margin: 2px 0; }
.links.inline { display: flex; flex-wrap: wrap; gap: 2px 22px; }
.links.inline li { margin: 0; }
.invite { margin: 0 0 12px; font-style: italic; }
footer { border-top: 1px solid var(--rule); padding-top: 24px; }
footer p { margin: 0 0 8px; }
.colophon { font: var(--t-label)/1.5 system-ui, 'Segoe UI', sans-serif; color: var(--quiet); }
</style>
</head>
<body class="$body_class">
<header>
  $brand
  <h1>$h1</h1>
  <p class="lead">$lead</p>
  <nav class="site-nav" aria-label="$nav_label">$site_nav</nav>
  <nav class="lang" aria-label="$lang_label">$lang_switch</nav>
</header>
<main>
$main
</main>
<footer>
  <p class="label">$footer</p>
  <p class="colophon">$colophon</p>
</footer>
</body>
</html>
