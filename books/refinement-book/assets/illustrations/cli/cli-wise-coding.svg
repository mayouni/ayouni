<text x="26" y="73.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14.5" xml:space="preserve"><tspan fill="#f0914f">❯ </tspan><tspan fill="#e8e1d1">stz refine --assist "student savings product"</tspan></text>
<text x="26" y="97.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14.5" xml:space="preserve"><tspan fill="#f0914f">stz:</tspan><tspan fill="#cfc7b5"> a savings product needs a rate profile. Which shape?</tspan></text>
<text x="26" y="121.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14.5" xml:space="preserve"><tspan fill="#cfc7b5">     </tspan><tspan fill="#82c0ae">1</tspan><tspan fill="#cfc7b5"> fixed rate    </tspan><tspan fill="#82c0ae">2</tspan><tspan fill="#cfc7b5"> tiered by balance    </tspan><tspan fill="#82c0ae">3</tspan><tspan fill="#cfc7b5"> indexed (BCEAO base)</tspan></text>
<text x="26" y="145.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14.5" xml:space="preserve"><tspan fill="#f0914f">❯ </tspan><tspan fill="#e8e1d1">2</tspan></text>
<text x="26" y="169.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14.5" xml:space="preserve"><tspan fill="#f0914f">stz:</tspan><tspan fill="#cfc7b5"> tiers need boundaries. Answer with values, a rule — or examples.</tspan></text>
<text x="26" y="193.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14.5" xml:space="preserve"><tspan fill="#f0914f">❯ </tspan><tspan fill="#e8e1d1">examples: 0 → 2.5   100000 → 3.0   500000 → 3.5</tspan></text>
<text x="26" y="217.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14.5" xml:space="preserve"><tspan fill="#f0914f">stz:</tspan><tspan fill="#cfc7b5"> induced </tspan><tspan fill="#82c0ae">3</tspan><tspan fill="#cfc7b5"> tiers from your examples</tspan></text>
<text x="26" y="241.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14.5" xml:space="preserve"><tspan fill="#9fc98f">     all within policy savings_rate_band ✓</tspan><tspan fill="#8d8471">   nothing guessed, nothing landed</tspan></text>
