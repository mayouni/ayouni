<text x="26" y="73.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14.5" xml:space="preserve"><tspan fill="#f0914f">❯ </tspan><tspan fill="#e8e1d1">stz refine penalty_cap --to 22</tspan></text>
