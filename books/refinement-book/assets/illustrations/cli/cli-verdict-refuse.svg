<text x="26" y="241.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14.5" xml:space="preserve"><tspan fill="#f0914f">  what happened  </tspan><tspan fill="#cfc7b5">22 exceeds the declared bound </tspan><tspan fill="#82c0ae">10..20</tspan></text>
