<text x="26" y="169.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14.5" xml:space="preserve"><tspan fill="#f0914f">  vat_rate     </tspan><tspan fill="#cfc7b5">param   </tspan><tspan fill="#82c0ae">0.18</tspan><tspan fill="#cfc7b5">   bounds </tspan><tspan fill="#82c0ae">0.00..0.25</tspan></text>
