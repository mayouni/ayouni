<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" aria-label="The polyglot loop: the language is the authority in its own gate" font-family="'Inter',sans-serif">
  <!-- six stations around a loop -->
  <g>
    <rect x="40" y="60" width="160" height="46" rx="8" fill="#ffffff" stroke="#1a1612" stroke-width="1.1"/>
    <text x="120" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1612">1 · IMPORT</text>
    <text x="120" y="96" text-anchor="middle" font-size="8.5" fill="#6b6358">pricing.py, unchanged on disk</text>
  </g>
  <g>
    <rect x="240" y="34" width="160" height="46" rx="8" fill="#ffffff" stroke="#0f8a7d" stroke-width="1.4"/>
    <text x="320" y="54" text-anchor="middle" font-size="10" font-weight="700" fill="#0f8a7d">2 · THE LANGUAGE LIFTS</text>
    <text x="320" y="70" text-anchor="middle" font-size="8.5" fill="#6b6358">Python's own parser reads Python</text>
  </g>
  <g>
    <rect x="440" y="60" width="160" height="46" rx="8" fill="#ffffff" stroke="#1a1612" stroke-width="1.1"/>
    <text x="520" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1612">3 · THE GRAPH + POINTS</text>
    <text x="520" y="96" text-anchor="middle" font-size="8.5" fill="#6b6358">typed nodes · declared knobs</text>
  </g>
  <g>
    <rect x="440" y="200" width="160" height="46" rx="8" fill="#ffffff" stroke="#1a1612" stroke-width="1.1"/>
    <text x="520" y="220" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1612">4 · A TYPED PROPOSAL</text>
    <text x="520" y="236" text-anchor="middle" font-size="8.5" fill="#6b6358">through any door</text>
  </g>
  <g>
    <rect x="240" y="226" width="160" height="52" rx="8" fill="#ffffff" stroke="#E96A1A" stroke-width="1.5"/>
    <text x="320" y="246" text-anchor="middle" font-size="10" font-weight="700" fill="#E96A1A">5 · THE GATE</text>
    <text x="320" y="260" text-anchor="middle" font-size="8.5" fill="#6b6358">structural: by the language itself</text>
    <text x="320" y="272" text-anchor="middle" font-size="8.5" fill="#6b6358">constraint · derivation · governance: shared</text>
  </g>
  <g>
    <rect x="40" y="200" width="160" height="46" rx="8" fill="#ffffff" stroke="#0f8a7d" stroke-width="1.4"/>
    <text x="120" y="220" text-anchor="middle" font-size="10" font-weight="700" fill="#0f8a7d">6 · EXACT APPLY</text>
    <text x="120" y="236" text-anchor="middle" font-size="8.5" fill="#6b6358">only the spans change · re-validated</text>
  </g>

  <!-- loop arrows -->
  <g stroke="#9a9078" stroke-width="1.3" fill="none">
    <path d="M204 76 C 218 68, 226 64, 236 60"/><path d="M236 60 l-9 0 l3 8 z" fill="#9a9078" stroke="none"/>
    <path d="M404 60 C 414 64, 422 68, 436 76"/><path d="M436 76 l-6 -7 l-4 8 z" fill="#9a9078" stroke="none"/>
    <path d="M520 106 L520 196"/><path d="M520 196 l-5 -9 l10 0 z" fill="#9a9078" stroke="none"/>
    <path d="M436 240 C 424 244, 416 248, 404 250"/><path d="M404 250 l9 2 l-2 -9 z" fill="#9a9078" stroke="none"/>
    <path d="M236 252 C 224 250, 216 246, 204 240"/><path d="M204 240 l7 6 l3 -8 z" fill="#9a9078" stroke="none"/>
    <path d="M120 196 L120 110"/><path d="M120 110 l-5 9 l10 0 z" fill="#9a9078" stroke="none"/>
  </g>

  <!-- generalization note -->
  <text x="320" y="152" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6b6358">Prolog validates Prolog. Julia validates Julia.</text>
  <text x="320" y="170" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6b6358">The graph-side stages never change.</text>

  <text x="320" y="318" text-anchor="middle" font-family="'EB Garamond',serif" font-size="14" font-style="italic" fill="#1a1612">One gate, many languages — each language the authority on its own structure.</text>
</svg>
