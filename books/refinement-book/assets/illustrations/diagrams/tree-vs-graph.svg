<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" aria-label="A tree of files versus a typed graph" font-family="'Inter',sans-serif">
  <!-- left: file tree -->
  <g font-size="12" fill="#1a1612">
    <rect x="26" y="48" width="13" height="10" rx="2" fill="#9a9078"/>
    <text x="46" y="58">lending/</text>
    <text x="60" y="82" fill="#6b6358">pricing.py</text>
    <text x="60" y="104" fill="#6b6358">risk.py</text>
    <text x="60" y="126" fill="#6b6358">policy.py</text>
    <rect x="26" y="140" width="13" height="10" rx="2" fill="#9a9078"/>
    <text x="46" y="150">tests/</text>
    <text x="60" y="174" fill="#6b6358">test_pricing.py</text>
  </g>
  <text x="120" y="214" text-anchor="middle" font-family="'EB Garamond',serif" font-size="13" font-style="italic" fill="#6b6358">a tree of files</text>
  <text x="120" y="232" text-anchor="middle" font-family="'EB Garamond',serif" font-size="13" font-style="italic" fill="#6b6358">— where text lives</text>

  <g stroke="#1a1612" stroke-width="1.6" fill="none">
    <line x1="232" y1="120" x2="292" y2="120"/><path d="M292 120 l-9 -5 l0 10 z" fill="#1a1612" stroke="none"/>
  </g>

  <!-- right: typed graph -->
  <g stroke="#6b6358" stroke-width="1.1" fill="none" opacity="0.7">
    <line x1="430" y1="70" x2="370" y2="130"/>
    <line x1="430" y1="70" x2="500" y2="120"/>
    <line x1="370" y1="130" x2="430" y2="185"/>
    <line x1="500" y1="120" x2="430" y2="185"/>
  </g>
  <text x="382" y="92" font-size="9" font-style="italic" fill="#6b6358">calls</text>
  <text x="478" y="86" font-size="9" font-style="italic" fill="#6b6358">constrained by</text>
  <line x1="430" y1="70" x2="430" y2="185" stroke="#6e2a86" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="430" cy="70" r="13" fill="#2F6B3A"/><text x="430" y="74" text-anchor="middle" font-size="9" fill="#fff">fn</text>
  <rect x="357" y="118" width="26" height="24" rx="4" fill="#0f8a7d"/><text x="370" y="134" text-anchor="middle" font-size="9" fill="#fff">type</text>
  <path d="M500 106 l14 14 l-14 14 l-14 -14 z" fill="#E96A1A"/><text x="500" y="124" text-anchor="middle" font-size="8.5" fill="#fff">policy</text>
  <circle cx="430" cy="185" r="13" fill="#6e2a86"/><text x="430" y="189" text-anchor="middle" font-size="8" fill="#fff">req</text>
  <text x="438" y="140" font-size="9" font-style="italic" fill="#6e2a86">satisfies</text>
  <text x="475" y="214" text-anchor="middle" font-family="'EB Garamond',serif" font-size="13" font-style="italic" fill="#6b6358">a typed graph</text>
  <text x="475" y="232" text-anchor="middle" font-family="'EB Garamond',serif" font-size="13" font-style="italic" fill="#6b6358">— how the parts relate</text>
</svg>
