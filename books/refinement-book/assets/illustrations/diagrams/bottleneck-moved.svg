<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" aria-label="The bottleneck moved from writing to review" font-family="'Inter',sans-serif">
  <!-- ============ LEFT: then ============ -->
  <text x="190" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1612" letter-spacing="1">THEN</text>
  <text x="190" y="58" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6b6358">writing was slow, review kept up</text>

  <!-- one change per week trickles in -->
  <g>
    <rect x="60" y="120" width="56" height="40" rx="4" fill="#ffffff" stroke="#6b6358"/>
    <line x1="70" y1="132" x2="106" y2="132" stroke="#cfc8b4" stroke-width="2"/>
    <line x1="70" y1="140" x2="98" y2="140" stroke="#cfc8b4" stroke-width="2"/>
    <line x1="70" y1="148" x2="102" y2="148" stroke="#cfc8b4" stroke-width="2"/>
    <text x="88" y="180" text-anchor="middle" font-size="10" fill="#6b6358">one change</text>
  </g>
  <g stroke="#1a1612" stroke-width="1.4" fill="none">
    <line x1="128" y1="140" x2="196" y2="140"/><path d="M196 140 l-8 -4.5 l0 9 z" fill="#1a1612" stroke="none"/>
  </g>
  <!-- the reviewer, comfortable -->
  <g>
    <circle cx="240" cy="140" r="26" fill="#ffffff" stroke="#1a1612" stroke-width="1.4"/>
    <circle cx="240" cy="132" r="7.5" fill="none" stroke="#1a1612" stroke-width="1.4"/>
    <path d="M226 152 a14 11 0 0 1 28 0" fill="none" stroke="#1a1612" stroke-width="1.4"/>
    <text x="240" y="192" text-anchor="middle" font-size="10" fill="#6b6358">the reviewer</text>
  </g>
  <g stroke="#2F6B3A" stroke-width="1.4" fill="none">
    <line x1="278" y1="140" x2="332" y2="140"/><path d="M332 140 l-8 -4.5 l0 9 z" fill="#2F6B3A" stroke="none"/>
  </g>
  <text x="305" y="128" text-anchor="middle" font-size="10" fill="#2F6B3A">read, understood,</text>
  <text x="305" y="158" text-anchor="middle" font-size="10" fill="#2F6B3A">approved</text>

  <!-- divider -->
  <line x1="380" y1="80" x2="380" y2="320" stroke="#cfc8b4" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ============ RIGHT: now ============ -->
  <text x="570" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1612" letter-spacing="1">NOW</text>
  <text x="570" y="58" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6b6358">writing is instant, review is the narrow neck</text>

  <!-- the pile of machine-speed changes -->
  <g>
    <g transform="translate(408,92)">
      <rect width="48" height="34" rx="4" fill="#ffffff" stroke="#6b6358"/>
      <line x1="8" y1="11" x2="38" y2="11" stroke="#cfc8b4" stroke-width="2"/><line x1="8" y1="18" x2="32" y2="18" stroke="#cfc8b4" stroke-width="2"/><line x1="8" y1="25" x2="35" y2="25" stroke="#cfc8b4" stroke-width="2"/>
    </g>
    <g transform="translate(462,104)">
      <rect width="48" height="34" rx="4" fill="#ffffff" stroke="#6b6358"/>
      <line x1="8" y1="11" x2="38" y2="11" stroke="#cfc8b4" stroke-width="2"/><line x1="8" y1="18" x2="30" y2="18" stroke="#cfc8b4" stroke-width="2"/><line x1="8" y1="25" x2="36" y2="25" stroke="#cfc8b4" stroke-width="2"/>
    </g>
    <g transform="translate(414,140)">
      <rect width="48" height="34" rx="4" fill="#ffffff" stroke="#6b6358"/>
      <line x1="8" y1="11" x2="36" y2="11" stroke="#cfc8b4" stroke-width="2"/><line x1="8" y1="18" x2="34" y2="18" stroke="#cfc8b4" stroke-width="2"/><line x1="8" y1="25" x2="30" y2="25" stroke="#cfc8b4" stroke-width="2"/>
    </g>
    <g transform="translate(468,152)">
      <rect width="48" height="34" rx="4" fill="#ffffff" stroke="#6b6358"/>
      <line x1="8" y1="11" x2="37" y2="11" stroke="#cfc8b4" stroke-width="2"/><line x1="8" y1="18" x2="33" y2="18" stroke="#cfc8b4" stroke-width="2"/><line x1="8" y1="25" x2="38" y2="25" stroke="#cfc8b4" stroke-width="2"/>
    </g>
    <g transform="translate(422,188)">
      <rect width="48" height="34" rx="4" fill="#ffffff" stroke="#6b6358"/>
      <line x1="8" y1="11" x2="35" y2="11" stroke="#cfc8b4" stroke-width="2"/><line x1="8" y1="18" x2="38" y2="18" stroke="#cfc8b4" stroke-width="2"/><line x1="8" y1="25" x2="31" y2="25" stroke="#cfc8b4" stroke-width="2"/>
    </g>
    <g transform="translate(474,200)">
      <rect width="48" height="34" rx="4" fill="#ffffff" stroke="#6b6358"/>
      <line x1="8" y1="11" x2="36" y2="11" stroke="#cfc8b4" stroke-width="2"/><line x1="8" y1="18" x2="34" y2="18" stroke="#cfc8b4" stroke-width="2"/><line x1="8" y1="25" x2="37" y2="25" stroke="#cfc8b4" stroke-width="2"/>
    </g>
    <text x="466" y="262" text-anchor="middle" font-size="10" fill="#6b6358">changes at machine speed</text>
  </g>

  <!-- the queue narrowing into the same one reviewer -->
  <g stroke="#E96A1A" stroke-width="1.6" fill="none">
    <path d="M528 110 C 560 120, 580 135, 596 152"/>
    <path d="M528 168 C 556 164, 576 162, 596 160"/>
    <path d="M530 216 C 560 206, 578 186, 596 168"/>
    <path d="M596 160 l-8 -5 l1 10 z" fill="#E96A1A" stroke="none"/>
  </g>
  <!-- the same reviewer, overwhelmed -->
  <g>
    <circle cx="630" cy="160" r="26" fill="#ffffff" stroke="#E96A1A" stroke-width="1.8"/>
    <circle cx="630" cy="152" r="7.5" fill="none" stroke="#1a1612" stroke-width="1.4"/>
    <path d="M616 172 a14 11 0 0 1 28 0" fill="none" stroke="#1a1612" stroke-width="1.4"/>
    <text x="630" y="212" text-anchor="middle" font-size="10" fill="#6b6358">the same reviewer</text>
  </g>
  <g stroke="#9a9078" stroke-width="1.4" fill="none" stroke-dasharray="4 4">
    <line x1="668" y1="160" x2="716" y2="160"/><path d="M716 160 l-8 -4.5 l0 9 z" fill="#9a9078" stroke="none"/>
  </g>
  <text x="694" y="146" text-anchor="middle" font-size="10" font-style="italic" fill="#9a9078">approved…</text>
  <text x="694" y="180" text-anchor="middle" font-size="10" font-style="italic" fill="#9a9078">unread?</text>

  <!-- the moral -->
  <text x="380" y="348" text-anchor="middle" font-family="'EB Garamond',serif" font-size="16" font-style="italic" fill="#1a1612">The bottleneck did not disappear. It moved — from writing the change to trusting it.</text>
</svg>
