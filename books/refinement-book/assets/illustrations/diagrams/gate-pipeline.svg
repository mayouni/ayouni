<svg viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg" aria-label="The four-stage gate" font-family="'Inter',sans-serif">
  <text x="14" y="58" font-size="10" font-weight="700" letter-spacing="0.06em" fill="#6b6358">PROPOSAL</text>
  <line x1="14" y1="100" x2="40" y2="100" stroke="#1a1612" stroke-width="1.4"/><path d="M40 100 l-8 -4 l0 8 z" fill="#1a1612"/>

  <rect x="44" y="74" width="100" height="52" rx="7" fill="#ffffff" stroke="#1a1612" stroke-width="1.1"/>
  <text x="94" y="98" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1612">structural</text>
  <text x="94" y="114" text-anchor="middle" font-size="8" fill="#6b6358">well-formed?</text>
  <line x1="146" y1="100" x2="160" y2="100" stroke="#1a1612" stroke-width="1.4"/><path d="M160 100 l-8 -4 l0 8 z" fill="#1a1612"/>

  <rect x="164" y="74" width="100" height="52" rx="7" fill="#ffffff" stroke="#1a1612" stroke-width="1.1"/>
  <text x="214" y="98" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1612">constraint</text>
  <text x="214" y="114" text-anchor="middle" font-size="8" fill="#6b6358">within the rules?</text>
  <line x1="266" y1="100" x2="280" y2="100" stroke="#1a1612" stroke-width="1.4"/><path d="M280 100 l-8 -4 l0 8 z" fill="#1a1612"/>

  <rect x="284" y="74" width="100" height="52" rx="7" fill="#ffffff" stroke="#1a1612" stroke-width="1.1"/>
  <text x="334" y="98" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1612">derivation</text>
  <text x="334" y="114" text-anchor="middle" font-size="8" fill="#6b6358">consequences hold?</text>
  <line x1="386" y1="100" x2="400" y2="100" stroke="#1a1612" stroke-width="1.4"/><path d="M400 100 l-8 -4 l0 8 z" fill="#1a1612"/>

  <rect x="404" y="74" width="100" height="52" rx="7" fill="#ffffff" stroke="#1a1612" stroke-width="1.1"/>
  <text x="454" y="98" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1612">governance</text>
  <text x="454" y="114" text-anchor="middle" font-size="8" fill="#6b6358">may this author?</text>
  <line x1="506" y1="100" x2="520" y2="100" stroke="#1a1612" stroke-width="1.4"/><path d="M520 100 l-8 -4 l0 8 z" fill="#1a1612"/>

  <!-- gate diamond -->
  <path d="M548 100 l24 -24 l24 24 l-24 24 z" fill="#E96A1A"/>
  <text x="572" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">gate</text>
  <g stroke="#1a1612" stroke-width="1.3" fill="none">
    <path d="M572 124 L572 160"/><path d="M572 160 l-4 -8 l8 0 z" fill="#1a1612" stroke="none"/>
  </g>
  <text x="572" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#2F6B3A">land ✓</text>
  <text x="572" y="194" text-anchor="middle" font-size="9" fill="#B83838">or refuse ✗</text>

  <!-- audit -->
  <line x1="310" y1="160" x2="566" y2="160" stroke="#cfc8b4" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="44" y="146" width="266" height="28" rx="6" fill="#efe9d6" stroke="#cfc8b4"/>
  <text x="177" y="164" text-anchor="middle" font-family="'EB Garamond',serif" font-size="12.5" font-style="italic" fill="#1a1612">either way, the verdict enters the audit chain</text>
  <text x="310" y="218" text-anchor="middle" font-family="'EB Garamond',serif" font-size="13.5" font-style="italic" fill="#6b6358">what cannot be validated cannot land</text>
</svg>
