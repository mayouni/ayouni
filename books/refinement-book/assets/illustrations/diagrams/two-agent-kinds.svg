<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" aria-label="Two agent kinds, one gate" font-family="'Inter',sans-serif">
  <!-- programmatic agent -->
  <rect x="40" y="40" width="240" height="150" rx="10" fill="#ffffff" stroke="#1a1612" stroke-width="1.2"/>
  <text x="160" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1612">THE PROGRAMMATIC AGENT</text>
  <g font-size="9.5" fill="#6b6358">
    <text x="160" y="90" text-anchor="middle">mind: rules, planners, optimizers</text>
    <text x="160" y="108" text-anchor="middle">deterministic · auditable · offline · free</text>
    <text x="160" y="126" text-anchor="middle">same answer every time, with Why</text>
  </g>
  <text x="160" y="158" text-anchor="middle" font-size="9" font-style="italic" fill="#2F6B3A">recomputes penalties when the cap moves</text>
  <text x="160" y="174" text-anchor="middle" font-size="9" font-style="italic" fill="#2F6B3A">watches drift · reruns the quarterly checks</text>

  <!-- model-backed agent -->
  <rect x="360" y="40" width="240" height="150" rx="10" fill="#ffffff" stroke="#1a1612" stroke-width="1.2"/>
  <text x="480" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1612">THE MODEL-BACKED AGENT</text>
  <g font-size="9.5" fill="#6b6358">
    <text x="480" y="90" text-anchor="middle">mind: a language model (one faculty)</text>
    <text x="480" y="108" text-anchor="middle">creative · linguistic · probabilistic</text>
    <text x="480" y="126" text-anchor="middle">brilliant on Tuesday, different on Friday</text>
  </g>
  <text x="480" y="158" text-anchor="middle" font-size="9" font-style="italic" fill="#2F6B3A">reads the new BCEAO circular</text>
  <text x="480" y="174" text-anchor="middle" font-size="9" font-style="italic" fill="#2F6B3A">drafts the intake as typed proposals</text>

  <!-- shared interface strip -->
  <rect x="40" y="206" width="560" height="30" rx="15" fill="#efe9d6" stroke="#cfc8b4"/>
  <text x="320" y="226" text-anchor="middle" font-size="9.5" fill="#1a1612">same interfaces: a goal · skills that verify · memory in the graph · tools · accountability</text>

  <!-- both propose into the one gate -->
  <g stroke="#1a1612" stroke-width="1.4" fill="none">
    <path d="M160 190 L160 206"/><path d="M480 190 L480 206"/>
    <path d="M320 236 L320 258"/><path d="M320 258 l-5 -9 l10 0 z" fill="#1a1612" stroke="none"/>
  </g>
  <path d="M320 288 l26 -26 l26 26 l-26 26 z" fill="#E96A1A" transform="translate(-26,0)"/>
  <text x="320" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">gate</text>
  <text x="404" y="292" font-size="10" font-style="italic" fill="#6b6358">the same four stages, for both</text>
</svg>
