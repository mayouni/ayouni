<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" aria-label="The ladder from pattern to agent" font-family="'Inter',sans-serif">
  <!-- rungs, bottom to top -->
  <g>
    <rect x="60" y="286" width="250" height="46" rx="8" fill="#ffffff" stroke="#1a1612" stroke-width="1.1"/>
    <text x="76" y="306" font-size="11" font-weight="700" fill="#1a1612">THE PATTERN</text>
    <text x="76" y="322" font-size="9.5" fill="#6b6358">recognizes a shape — and does nothing</text>
  </g>
  <g>
    <rect x="100" y="212" width="250" height="46" rx="8" fill="#ffffff" stroke="#1a1612" stroke-width="1.1"/>
    <text x="116" y="232" font-size="11" font-weight="700" fill="#1a1612">THE REFLEX</text>
    <text x="116" y="248" font-size="9.5" fill="#6b6358">patterns bound to actions — reacts, with provenance</text>
  </g>
  <g>
    <rect x="140" y="138" width="250" height="46" rx="8" fill="#ffffff" stroke="#1a1612" stroke-width="1.1"/>
    <text x="156" y="158" font-size="11" font-weight="700" fill="#1a1612">THE THINKING MACHINE</text>
    <text x="156" y="174" font-size="9.5" fill="#6b6358">many faculties, one state — settles to a thought, with Why</text>
  </g>
  <g>
    <rect x="180" y="64" width="250" height="46" rx="8" fill="#ffffff" stroke="#2F6B3A" stroke-width="1.6"/>
    <text x="196" y="84" font-size="11" font-weight="700" fill="#2F6B3A">THE AGENT</text>
    <text x="196" y="100" font-size="9.5" fill="#6b6358">a mind embodied: goal, memory, tools, accountability</text>
  </g>
  <!-- ladder arrows -->
  <g stroke="#9a9078" stroke-width="1.3" fill="none">
    <line x1="185" y1="286" x2="205" y2="262"/><path d="M205 262 l-8 2 l4 7 z" fill="#9a9078" stroke="none"/>
    <line x1="225" y1="212" x2="245" y2="188"/><path d="M245 188 l-8 2 l4 7 z" fill="#9a9078" stroke="none"/>
    <line x1="265" y1="138" x2="285" y2="114"/><path d="M285 114 l-8 2 l4 7 z" fill="#9a9078" stroke="none"/>
  </g>
  <g font-size="8.5" font-style="italic" fill="#9a9078">
    <text x="150" y="278">+ action</text>
    <text x="190" y="204">+ composition</text>
    <text x="230" y="130">+ a body and stakes</text>
  </g>

  <!-- the industry loop, placed on the ladder -->
  <rect x="462" y="58" width="158" height="150" rx="10" fill="#efe9d6" stroke="#cfc8b4"/>
  <text x="541" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1612">THE INDUSTRY “AGENT”</text>
  <text x="541" y="100" text-anchor="middle" font-size="9" fill="#6b6358">an LLM in a loop</text>
  <text x="541" y="115" text-anchor="middle" font-size="9" fill="#6b6358">with tools, memory, a goal</text>
  <line x1="478" y1="126" x2="604" y2="126" stroke="#cfc8b4"/>
  <text x="541" y="144" text-anchor="middle" font-size="9" font-style="italic" fill="#1a1612">= the top rung,</text>
  <text x="541" y="158" text-anchor="middle" font-size="9" font-style="italic" fill="#1a1612">with one faculty (a model)</text>
  <text x="541" y="172" text-anchor="middle" font-size="9" font-style="italic" fill="#1a1612">and, usually,</text>
  <text x="541" y="186" text-anchor="middle" font-size="9" font-style="italic" fill="#B83838">no governance underneath</text>
  <g stroke="#9a9078" stroke-width="1.2" fill="none" stroke-dasharray="4 3">
    <line x1="462" y1="90" x2="434" y2="88"/><path d="M434 88 l8 -3 l0 7 z" fill="#9a9078" stroke="none"/>
  </g>

  <text x="320" y="350" text-anchor="middle" font-family="'EB Garamond',serif" font-size="14" font-style="italic" fill="#1a1612">Each rung adds exactly one thing. The famous loop is a special case of the top one.</text>
</svg>
